<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>E-Absensi Scanner</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #eff6ff; color: #1e40af; }
    .status.ok { background: #ecfdf5; color: #065f46; }
    .status.warn { background: #fffbeb; color: #92400e; }
    .status.error { background: #fef2f2; color: #991b1b; }

    .raw-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: #0f172a;
      color: #94a3b8;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
      display: none;
    }
    .raw-box.show { display: block; }
    .raw-box strong { color: #38bdf8; }

    .camera-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #0f172a;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }
    .camera-box.active { display: block; }
    #reader {
      width: 100%;
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .result-box {
      margin-top: 14px;
      padding: 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: none;
    }
    .result-box.show { display: block; }
    .result-box .name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .result-box .meta {
      font-size: 13px;
      color: var(--muted);
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>E-Absensi Scanner</h1>
      <p class="subtitle">Kamera + Scanner VSC PB-333U</p>

      <label>Scan Kartu (klik kotak ini dulu)</label>
      <input
        type="text"
        id="omniScannerInput"
        placeholder="Klik di sini lalu scan kartu..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      />

      <div class="raw-box" id="rawBox">
        <strong>Raw:</strong> <span id="rawText">-</span>
      </div>

      <div class="btn-row">
        <button class="btn-primary" id="btnCamera">Buka Kamera</button>
        <button class="btn-secondary" id="btnStopCamera" disabled>Stop Kamera</button>
      </div>

      <div class="camera-box" id="cameraBox">
        <div id="reader"></div>
      </div>

      <div class="status info" id="statusBox">Siap scan. Fokuskan ke kotak input di atas.</div>

      <div class="result-box" id="resultBox">
        <div class="name" id="resultName">-</div>
        <div class="meta" id="resultMeta">-</div>
      </div>

      <p class="hint">
        Tips VSC PB-333U: pastikan kotak input berwarna biru (fokus), lalu scan.
        Kalau masih salah, lihat teks "Raw" di atas untuk diagnosis.
      </p>
    </div>
  </div>

  <!-- html5-qrcode library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    // =====================================================
    // GANTI URL INI DENGAN WEB APP GOOGLE APPS SCRIPT KAMU
    // =====================================================
    const GAS_URL = "https://script.google.com/macros/s/XXXXX/exec";

    // =====================================================
    // STATE
    // =====================================================
    let busy = false;
    let html5QrCode = null;
    let lastScanned = "";
    let lastScanTime = 0;

    // =====================================================
    // HELPERS
    // =====================================================
    function setStatus(msg, type = "info") {
      const el = document.getElementById("statusBox");
      el.className = "status show " + type;
      el.textContent = msg;
    }

    function showRaw(text) {
      const box = document.getElementById("rawBox");
      const span = document.getElementById("rawText");
      span.textContent = text || "-";
      box.classList.add("show");
    }

    function showResult(name, meta) {
      const box = document.getElementById("resultBox");
      document.getElementById("resultName").textContent = name;
      document.getElementById("resultMeta").textContent = meta;
      box.classList.add("show");
    }

    function hideResult() {
      document.getElementById("resultBox").classList.remove("show");
    }

    // =====================================================
    // PARSER ROBUST (perbaikan IMAROH → MAROH)
    // =====================================================
    function parseQr(rawText) {
      const raw = String(rawText || "").trim();
      if (!raw) return { type: "unknown", raw: "" };

      const compact = raw.replace(/\s+/g, "").toUpperCase();

      // ---------- GURU ----------
      let username = null;

      // 1. Format ideal: GURU|IMAROH
      let m = compact.match(/^GURU\|(.+)$/);
      if (m) username = m[1];

      // 2. | berubah jadi : - =
      if (!username) {
        m = compact.match(/^GURU[:\-=](.+)$/);
        if (m) username = m[1];
      }

      // 3. | berubah jadi I atau J → GURUIIMAROH atau GURUJIMAROH
      if (!username) {
        m = compact.match(/^GURU[IJ](.+)$/);
        if (m) {
          const after = m[1];                 // contoh: IMAROH atau MAROH
          const alt = compact.slice(4);       // setelah "GURU" → IMAROH

          // Prefer versi yang lebih panjang (menyimpan huruf pertama username)
          if (alt.length > after.length) {
            username = alt;
          } else {
            username = after;
          }
        }
      }

      // 4. Separator hilang total: GURUIMAROH
      if (!username && compact.startsWith("GURU") && compact.length > 6) {
        username = compact.slice(4);
      }

      if (username) {
        username = username.replace(/[^A-Z0-9._-]/g, "");
        if (username.length >= 3) {
          return {
            type: "guru",
            username: username,
            raw: raw
          };
        }
      }

      // ---------- SISWA (NISN) ----------
      const digitsOnly = raw.replace(/\D/g, "");
      if (/^\d{8,20}$/.test(digitsOnly)) {
        return {
          type: "siswa",
          nisn: digitsOnly,
          raw: raw
        };
      }

      // Variasi NISN: 123... atau NISN|123...
      m = raw.match(/NISN\s*(?:[:=|]\s*|\s+)(\d{8,20})/i);
      if (m) {
        return {
          type: "siswa",
          nisn: m[1],
          raw: raw
        };
      }

      return { type: "unknown", raw: raw };
    }

    // =====================================================
    // JSONP (komunikasi ke Google Apps Script)
    // =====================================================
    function jsonp(params, timeout = 15000) {
      return new Promise((resolve, reject) => {
        const callbackName = "__eabsensi_cb_" + Date.now() + "_" + Math.random().toString(36).slice(2);
        const script = document.createElement("script");
        let finished = false;

        const cleanup = () => {
          try { delete window[callbackName]; } catch (_) {}
          script.remove();
        };

        const finish = (err, data) => {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          cleanup();
          if (err) reject(err);
          else resolve(data);
        };

        const timer = setTimeout(() => {
          finish(new Error("Timeout menghubungi server"));
        }, timeout);

        window[callbackName] = (data) => finish(null, data);

        const qs = new URLSearchParams({ ...params, callback: callbackName });
        script.src = GAS_URL + "?" + qs.toString();
        script.onerror = () => finish(new Error("Gagal memuat script API"));
        document.body.appendChild(script);
      });
    }

    // =====================================================
    // PROSES HASIL SCAN
    // =====================================================
    async function processQr(rawText) {
      if (busy) return;

      // Debounce (hindari double scan)
      const now = Date.now();
      if (rawText === lastScanned && now - lastScanTime < 2500) return;
      lastScanned = rawText;
      lastScanTime = now;

      showRaw(rawText);
      const parsed = parseQr(rawText);

      if (parsed.type === "unknown") {
        setStatus("⚠️ QR terbaca, tapi format tidak dikenali.\nRaw: " + rawText, "warn");
        hideResult();
        return;
      }

      busy = true;
      setStatus("⏳ Memproses data...", "info");
      hideResult();

      try {
        let response;

        if (parsed.type === "guru") {
          setStatus("⏳ Absensi Guru: " + parsed.username + " ...", "info");
          response = await jsonp({
            action: "scanAbsensiGuru",
            username: parsed.username
          });
        } else {
          setStatus("⏳ Absensi Siswa NISN: " + parsed.nisn + " ...", "info");
          response = await jsonp({
            action: "scanAbsensiSiswa",
            nisn: parsed.nisn
          });
        }

        if (response && response.ok) {
          setStatus("✅ " + (response.message || "Berhasil"), "ok");
          showResult(
            response.nama || (parsed.type === "guru" ? parsed.username : parsed.nisn),
            response.keterangan || (parsed.type === "guru" ? "Guru" : "Siswa") + " • " + new Date().toLocaleTimeString("id-ID")
          );
        } else {
          setStatus("❌ " + (response?.error || response?.message || "Gagal memproses"), "error");
        }
      } catch (err) {
        setStatus("❌ " + err.message, "error");
      } finally {
        busy = false;
        // Kembalikan fokus ke input scanner
        setTimeout(() => {
          document.getElementById("omniScannerInput").focus();
          document.getElementById("omniScannerInput").value = "";
        }, 300);
      }
    }

    // =====================================================
    // HARDWARE SCANNER (VSC PB-333U) - Keyboard Wedge
    // =====================================================
    const input = document.getElementById("omniScannerInput");

    // Selalu fokuskan input
    function keepFocus() {
      if (document.activeElement !== input) {
        input.focus();
      }
    }
    setInterval(keepFocus, 800);
    input.focus();

    // Saat user menekan Enter (terminator scanner)
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value.trim();
        if (val) {
          processQr(val);
          input.value = "";
        }
      }
    });

    // Cadangan: jika scanner tidak kirim Enter
    let bufferTimer = null;
    input.addEventListener("input", () => {
      clearTimeout(bufferTimer);
      bufferTimer = setTimeout(() => {
        const val = input.value.trim();
        if (val.length >= 5) {
          processQr(val);
          input.value = "";
        }
      }, 400);
    });

    // =====================================================
    // KAMERA
    // =====================================================
    const btnCamera = document.getElementById("btnCamera");
    const btnStopCamera = document.getElementById("btnStopCamera");
    const cameraBox = document.getElementById("cameraBox");

    btnCamera.addEventListener("click", async () => {
      try {
        if (html5QrCode) {
          await html5QrCode.stop();
          html5QrCode = null;
        }

        cameraBox.classList.add("active");
        btnCamera.disabled = true;
        btnStopCamera.disabled = false;
        setStatus("📷 Kamera aktif. Arahkan ke QR code...", "info");

        html5QrCode = new Html5Qrcode("reader");
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          (decodedText) => {
            processQr(decodedText);
          },
          () => {}
        );
      } catch (err) {
        setStatus("❌ Tidak bisa membuka kamera: " + err.message, "error");
        cameraBox.classList.remove("active");
        btnCamera.disabled = false;
        btnStopCamera.disabled = true;
      }
    });

    btnStopCamera.addEventListener("click", async () => {
      try {
        if (html5QrCode) {
          await html5QrCode.stop();
          html5QrCode = null;
        }
      } catch (_) {}
      cameraBox.classList.remove("active");
      btnCamera.disabled = false;
      btnStopCamera.disabled = true;
      setStatus("Kamera dimatikan. Siap scan dengan alat.", "info");
      input.focus();
    });

    // =====================================================
    // INIT
    // =====================================================
    setStatus("Siap. Klik kotak input lalu scan kartu guru/siswa.", "info");
  </script>
</body>
</html>
